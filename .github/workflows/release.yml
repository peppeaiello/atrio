name: Release

# Push a tag like v0.2.0 to publish a release. The installed Atrio finds it from
# Settings > Atrio and installs atrio.tar.gz with the updater (scripts/atrio-update).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Package
        run: |
          tar -czf atrio.tar.gz -C build/sysroot/var/lib/casaos/www .
          sha256sum atrio.tar.gz > atrio.tar.gz.sha256

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # v0.2.0-rc.1 and the like are not offered to installed copies
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            atrio.tar.gz
            atrio.tar.gz.sha256
